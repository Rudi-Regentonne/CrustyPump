<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrustyPump Dashboard</title>
    <link rel="stylesheet" href="style.css?v=4">
    
    <!-- Chart.js and date-fns adapter -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    
    <!-- SortableJS for drag and drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <!-- jsPDF: embed chart canvases directly. html2canvas cannot see off-screen clones. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <h1>CrustyPump Dashboard</h1>
            <span class="subtitle">Connected to TimescaleDB</span>
        </header>

        <div id="time-controls">
            <div class="control-group">
                <label>Time Range:</label>
                <select id="time-range-preset">
                    <option value="1m">Last 1 Minute</option>
                    <option value="2m">Last 2 Minutes</option>
                    <option value="15m">Last 15 Minutes</option>
                    <option value="1h" selected>Last 1 Hour</option>
                    <option value="24h">Last 24 Hours</option>
                    <option value="7d">Last 7 Days</option>
                    <option value="custom">Custom</option>
                </select>
            </div>

            <div id="custom-time-container" class="control-group hidden">
                <label>Start:</label>
                <input type="datetime-local" id="datetime-start" step="1">
                <label>End:</label>
                <input type="datetime-local" id="datetime-end" step="1">
            </div>

            <div class="control-group">
                <label>Granularity:</label>
                <select id="granularity">
                    <option value="10 seconds">10 Seconds</option>
                    <option value="1 minute" selected>1 Minute</option>
                    <option value="15 minutes">15 Minutes</option>
                    <option value="1 hour">1 Hour</option>
                    <option value="1 day">1 Day</option>
                </select>
            </div>

            <button id="refresh-btn" class="btn primary">Refresh</button>
            <button id="export-btn" class="btn danger export">PDF Export</button>
        </div>

        <div id="body-container">
            <aside id="sidebar">
                <h3>Available Channels</h3>
                <div class="input-group">
                    <select id="channel-selector">
                        <option value="">Select a channel...</option>
                    </select>
                    <button id="add-btn" class="btn success w-100">Add to Dashboard</button>
                </div>
                
                <hr>
                
                <h4>Layout Actions</h4>
                <button id="save-btn" class="btn warning w-100 mb-10">Save Current Layout</button>
                <button id="load-btn" class="btn secondary w-100">Reload Saved Layout</button>
                <div id="status-msg"></div>
            </aside>

            <main id="main-area">
                <div id="tiles-container">
                    <p id="empty-state">Select channels from the sidebar to add graphs</p>
                </div>
            </main>
        </div>
        
        <footer>
            <span>CrustyPump v0.2.0</span>
        </footer>
    </div>
    <script src="app.js?v=6"></script>
</body>
</html>
