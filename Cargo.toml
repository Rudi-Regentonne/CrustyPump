[package]
name = "heatpump"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = {version = "1.48.0", features = ["rt-multi-thread", "macros"]}
once_cell = "1.21.3"
regex = "1.12.2"
reqwest = { version = "0.12.24", features = [ "cookies"] }
dotenv = "0.15.0"
log = "0.4.29"
env_logger = "0.11.8"
serde = "1.0.228"
serde_json = "1.0.145"
influxdb2 = "0.5.2"
influxdb2-structmap = "0.2.0"
chrono = "0.4.42"
futures = "0.3.31"

[dev-dependencies]
httpmock = "0.8.2"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
